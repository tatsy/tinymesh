name: CI

on:
  push:
    branches: [master, dev, pr]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  BUILD_TYPE: Release
  OMP_NUM_THREADS: "2"

jobs:
  cpp:
    name: C++ / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure on Windows
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build
          -G "Visual Studio 18 2026" -A x64
          -DTINYMESH_BUILD_TESTS=ON
          -DTINYMESH_BUILD_EXAMPLES=ON

      - name: Configure on Linux and macOS
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
          -DTINYMESH_BUILD_TESTS=ON
          -DTINYMESH_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config "$BUILD_TYPE" --parallel 2

      - name: Test
        run: ctest --test-dir build -C "$BUILD_TYPE" --output-on-failure --no-tests=error

  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Intel runners also support the existing Python 3.8 and 3.9 builds.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install the latest uv and set the python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        run: uv build

      - name: Test
        run: uv run --frozen pytest -s tests/python

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: Release
    needs: [cpp, python]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
