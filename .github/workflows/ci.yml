name: CI

on:
  push:
    branches: [master, dev, pr]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  BUILD_TYPE: Release
  OMP_NUM_THREADS: "2"

jobs:
  cpp:
    name: C++ / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15-intel]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure on Windows
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A x64
          -DTINYMESH_BUILD_TESTS=ON
          -DTINYMESH_BUILD_EXAMPLES=ON

      - name: Configure on Linux and macOS
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
          -DTINYMESH_BUILD_TESTS=ON
          -DTINYMESH_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config "$BUILD_TYPE" --parallel 2

      - name: Test
        run: ctest --test-dir build -C "$BUILD_TYPE" --output-on-failure --no-tests=error

  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Intel runners also support the existing Python 3.8 and 3.9 builds.
        os: [ubuntu-22.04, windows-2022, macos-15-intel]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Visual Studio 2022
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: "2022"
          arch: x64

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Install wheel and test dependencies
        run: python -m pip install dist/*.whl numpy pytest

      - name: Test
        run: python -m pytest -s tests/python

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: Release
    needs: [cpp, python]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
