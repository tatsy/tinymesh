[project]
name = "tinymesh"
dynamic = ["version"]
description = "TinyMesh: a light-weight mesh processing library"
license = "MPL-2.0"
authors = [{ name = "Tatsuya Yatagawa", email = "tatsy.mail@gmail.com" }]
readme = 'README.md'
keywords = ['graphics', 'geometry']
dependencies = ["numpy>=2.0.0", "scipy>=1.15.3"]
requires-python = ">=3.10,<3.14"

[project.optional-dependencies]
viz = ["matplotlib>=3.10.9"]

[project.urls]
Repository = "https://github.com/tatsy/tinymesh"
Homepage = "https://github.com/tatsy/tinymesh"

[dependency-groups]
dev = [
  "ty>=0.0.91",
  "ruff>=0.17.2",
  "pytest>=9.2.0",
]
examples = [
  "jupyterlab>=4.6.6",
  "open3d>=0.20.0",
]

[build-system]
requires = ["scikit-build-core>=0.11.4"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.build-type = "Release"
wheel.packages = ["python/tinymesh"]
build-dir = "build/python/{wheel_tag}"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "python/tinymesh/__init__.py"

[tool.scikit-build.cmake.define]
TINYMESH_BUILD_PYTHON = true
TINYMESH_BUILD_TESTS = false
TINYMESH_BUILD_EXAMPLES = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM"]
ignore = ["N806", "N812", "SIM108"]
fixable = ["ALL"]
unfixable = ["F401", "F841"]

[tool.ruff.lint.isort]
length-sort = true
lines-after-imports = 2
split-on-trailing-comma = true

[tool.ty.environment]
python = ".venv"
python-version = "3.12"

[tool.ty.terminal]
error-on-warning = false
